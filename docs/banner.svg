<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-label="Godot 4 + C# — Học lập trình game từ con số 0">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#060b16"/>
      <stop offset="0.55" stop-color="#0c1730"/>
      <stop offset="1" stop-color="#121f3d"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#478cbf"/>
      <stop offset="0.55" stop-color="#6ea8ff"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.6" stop-color="#dbeafe"/>
      <stop offset="1" stop-color="#93c5fd"/>
    </linearGradient>
    <radialGradient id="glow1" cx="0.16" cy="0.12" r="0.72">
      <stop offset="0" stop-color="#478cbf" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#478cbf" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.92" cy="0.86" r="0.62">
      <stop offset="0" stop-color="#7c3aed" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#7aa2e3" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1280" height="360" fill="url(#bg)"/>
  <rect width="1280" height="360" fill="url(#grid)"/>
  <rect width="1280" height="360" fill="url(#glow1)"/>
  <rect width="1280" height="360" fill="url(#glow2)"/>

  <!-- pixel stars -->
  <g fill="#bfdbfe">
    <rect x="742" y="48" width="5" height="5" opacity="0.65"/>
    <rect x="812" y="92" width="3" height="3" opacity="0.45"/>
    <rect x="902" y="44" width="4" height="4" opacity="0.55"/>
    <rect x="1178" y="62" width="5" height="5" opacity="0.6"/>
    <rect x="1226" y="142" width="3" height="3" opacity="0.4"/>
    <rect x="760" y="272" width="4" height="4" opacity="0.35"/>
    <rect x="880" y="310" width="5" height="5" opacity="0.4"/>
    <rect x="1210" y="286" width="4" height="4" opacity="0.5"/>
    <rect x="1120" y="38" width="3" height="3" opacity="0.5"/>
    <rect x="700" y="126" width="3" height="3" opacity="0.35"/>
  </g>
  <g fill="#a78bfa" opacity="0.55">
    <rect x="946" y="76" width="4" height="4"/>
    <rect x="1244" y="210" width="3" height="3"/>
    <rect x="730" y="316" width="3" height="3"/>
  </g>

  <!-- label pill -->
  <g>
    <rect x="72" y="48" width="268" height="34" rx="17" fill="#0f2444" stroke="#2f5b93" stroke-width="1.5"/>
    <circle cx="92" cy="65" r="4" fill="#4ade80"/>
    <text x="106" y="71" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" letter-spacing="1.4" fill="#9ec1ff">GODOT 4 · .NET 8 · C#</text>
  </g>

  <!-- title -->
  <text x="70" y="168" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Arial, sans-serif" font-size="76" font-weight="800" letter-spacing="-1.5" fill="url(#title)">Godot 4 + C#</text>

  <!-- subtitle -->
  <text x="72" y="212" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Arial, sans-serif" font-size="23" font-weight="600" letter-spacing="3.2" fill="#7dd3fc">HỌC LẬP TRÌNH GAME TỪ CON SỐ 0</text>

  <!-- divider -->
  <rect x="72" y="240" width="560" height="3" rx="1.5" fill="url(#accent)" opacity="0.9"/>

  <!-- stats -->
  <text x="72" y="282" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Arial, sans-serif" font-size="17" font-weight="600" letter-spacing="0.6" fill="#c7d7ef">23 BÀI HỌC<tspan fill="#5d7aa6" dx="12">•</tspan><tspan dx="12">4 GIÁO TRÌNH</tspan><tspan fill="#5d7aa6" dx="12">•</tspan><tspan dx="12">28 NGÀY</tspan><tspan fill="#5d7aa6" dx="12">•</tspan><tspan dx="12">11.700+ ASSETS</tspan></text>

  <!-- repo -->
  <text x="72" y="320" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" letter-spacing="0.5" fill="#6f89ad">github.com/KenOshi-dev/Godot</text>

  <!-- pixel gamepad -->
  <g transform="translate(978,96)">
    <rect x="0" y="26" width="214" height="124" rx="44" fill="#0e1e39" stroke="url(#accent)" stroke-width="4"/>
    <rect x="10" y="36" width="194" height="104" rx="34" fill="none" stroke="#1d3a63" stroke-width="1.5"/>

    <!-- d-pad -->
    <rect x="36" y="74" width="52" height="16" rx="4" fill="#9ec1ff"/>
    <rect x="54" y="56" width="16" height="52" rx="4" fill="#9ec1ff"/>
    <rect x="39" y="77" width="46" height="10" rx="3" fill="#c7ddff" opacity="0.35"/>

    <!-- face buttons -->
    <circle cx="156" cy="64" r="11" fill="#f472b6"/>
    <circle cx="184" cy="88" r="11" fill="#fbbf24"/>
    <circle cx="156" cy="112" r="11" fill="#34d399"/>
    <circle cx="128" cy="88" r="11" fill="#60a5fa"/>

    <!-- center sticks -->
    <circle cx="94" cy="92" r="15" fill="#13294a" stroke="#3d6092" stroke-width="2"/>
    <circle cx="94" cy="92" r="6" fill="#6ea8ff" opacity="0.75"/>

    <!-- tiny shine -->
    <rect x="28" y="40" width="34" height="4" rx="2" fill="#7dd3fc" opacity="0.35"/>
  </g>

  <!-- floating pixels around gamepad -->
  <g>
    <rect x="944" y="70" width="7" height="7" fill="#478cbf" opacity="0.8"/>
    <rect x="1206" y="240" width="8" height="8" fill="#a78bfa" opacity="0.8"/>
    <rect x="932" y="244" width="5" height="5" fill="#7dd3fc" opacity="0.65"/>
    <rect x="1220" y="88" width="5" height="5" fill="#f472b6" opacity="0.65"/>
    <rect x="1162" y="300" width="6" height="6" fill="#34d399" opacity="0.55"/>
  </g>

  <!-- bottom accent -->
  <rect x="0" y="356" width="1280" height="4" fill="url(#accent)" opacity="0.8"/>
</svg>
